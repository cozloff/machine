[domain.stripe]
semantic = "financial infrastructure platform within business operations"

[domain.stripe.symbols]
fi = { id = "FinancialInfrastructure", semantic = "systems that move, store, verify, account for, and report money" }
psp = { id = "PaymentServiceProvider", semantic = "network-facing payment acceptance layer" }
stripe = { id = "Stripe", semantic = "financial infrastructure platform implementation" }
revops = { id = "RevenueOperations", semantic = "business subsystem that manages revenue lifecycle" }
finops = { id = "FinanceOperations", semantic = "business subsystem that manages accounting, cash, tax, and controls" }
platformops = { id = "PlatformOperations", semantic = "business subsystem that embeds payments or financial services for users" }

[domain.stripe.structure.superset_graph]
kind = "directed_graph"
description = "what supersedes Stripe from a high-level service taxonomy"
uses = "domain.stripe.symbols"

adjacency = [
  ["fi", ["psp", "stripe", "revops", "finops", "platformops"]],
  ["psp", ["stripe"]],
  ["stripe", ["revops", "finops", "platformops"]]
]

[domain.stripe.service_symbols]
pay = { id = "Payments", semantic = "online and programmatic payment acceptance" }
checkout = { id = "Checkout", semantic = "hosted payment experience" }
plink = { id = "PaymentLinks", semantic = "no-code payable object creation" }
terminal = { id = "Terminal", semantic = "in-person payment acceptance" }
billing = { id = "Billing", semantic = "subscriptions, invoices, pricing, and recurring revenue" }
tax = { id = "Tax", semantic = "sales tax and VAT calculation and reporting support" }
recrec = { id = "RevenueRecognition", semantic = "accrual accounting automation for revenue" }
sigma = { id = "Sigma", semantic = "custom financial and operational reporting" }
data = { id = "DataPipeline", semantic = "warehouse sync for Stripe data" }
radar = { id = "Radar", semantic = "fraud and risk management" }
connect = { id = "Connect", semantic = "marketplace and platform payment routing" }
identity = { id = "Identity", semantic = "online identity verification" }
finconn = { id = "FinancialConnections", semantic = "linked bank account data access" }
issuing = { id = "Issuing", semantic = "card creation and card program operations" }
fina = { id = "FinancialAccounts", semantic = "financial accounts for platforms" }
capital = { id = "Capital", semantic = "business financing" }
crypto = { id = "Crypto", semantic = "crypto and stablecoin payment infrastructure" }
atlas = { id = "Atlas", semantic = "startup incorporation and company formation" }
climate = { id = "Climate", semantic = "carbon removal contribution workflow" }

[domain.stripe.structure.service_graph]
kind = "directed_graph"
description = "Stripe service family graph from financial infrastructure down to service modules"
uses = "domain.stripe.service_symbols"

adjacency = [
  ["pay", ["checkout", "plink", "terminal", "radar"]],
  ["billing", ["tax", "recrec", "sigma", "data"]],
  ["connect", ["identity", "finconn", "fina", "issuing"]],
  ["fina", ["capital"]],
  ["stripe", ["pay", "billing", "connect", "crypto", "atlas", "climate"]]
]

[domain.stripe.business_operation_symbols]
qi = { id = "QuoteIntake", semantic = "capture customer request" }
qv = { id = "QuoteValidation", semantic = "check completeness and feasibility" }
pmc = { id = "PricingMarginCheck", semantic = "estimate price, cost, risk, and margin" }
qa = { id = "QuoteApproval", semantic = "authorize quote" }
plc = { id = "PaymentLinkCreation", semantic = "create payable object" }
oc = { id = "OrderConversion", semantic = "turn payment into work order" }
rec = { id = "Reconciliation", semantic = "match payments, payouts, invoices, and accounting records" }

[domain.stripe.structure.quote_to_cash_fit_graph]
kind = "directed_graph"
description = "where Stripe services fit into quote-to-cash operations"
uses_symbols = "domain.stripe.business_operation_symbols"
uses_services = "domain.stripe.service_symbols"

adjacency = [
  ["qi", ["checkout", "plink"]],
  ["qv", ["identity", "finconn", "radar"]],
  ["pmc", ["billing", "tax"]],
  ["qa", ["billing"]],
  ["plc", ["plink", "checkout", "pay"]],
  ["oc", ["pay", "billing", "connect"]],
  ["rec", ["recrec", "sigma", "data"]]
]

