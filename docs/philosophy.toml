[machine_kernel]
name = "Machine Kernel"
thesis = "Agents persist by selecting policies across physical, informational, and currency networks under uncertainty."

[syntax]
toml = "structure"
ascii_math = "abstraction"
rust = "execution"
diagram = "composition"

[syntax.kernel]
symbol = "object/state/value"
transform = "change/relation/process"
structure = "composition/organization/system"

[anti_philosophy]
claim = "Math and science do not reveal grand meaning."
use = "They expose determinism, constraint, consequence, and policy."
meaning = "none assumed"
determinism = "state_t -> law -> state_t+1"
consequentialism = "action -> consequence -> survival_delta"
rule = "Understand the universe only enough to choose better actions."

[layer.0_substrate]
symbol = "field_state"
transform = "physical_law"
structure = "state_space"
ascii_math = "psi_t -> U(psi_t) -> psi_t+1"
rust = "state = evolve(state, law)"
meaning = "No mysticism: substrate is constraint."

[layer.1_physical_form]
symbol = "matter|energy|part|machine"
transform = "heat|force|deform|manufacture"
structure = "physical_system"
ascii_math = "material + process -> part"
rust = "part = manufacture(material, process)"
meaning = "Physics becomes cost, tolerance, throughput."

[layer.2_information]
symbol = "measurement|dataset|document|embedding"
transform = "observe|encode|predict|compress"
structure = "information_state"
ascii_math = "world -> measure -> data -> encode -> vector"
rust = "x = embed(observation)"
meaning = "Knowledge is not truth; it is usable state."

[layer.3_boundary]
symbol = "agent_boundary"
transform = "sense|filter|act"
structure = "markov_boundary"
ascii_math = "outside -> boundary -> inside"
rust = "belief = update(observation)"
meaning = "A self is a controlled interface."

[layer.4_agent]
symbol = "agent|firm|machine|model"
transform = "decide|act|learn"
structure = "policy_loop"
ascii_math = "S_t -> policy -> A_t -> S_t+1"
rust = "action = policy(state)"
meaning = "Agency is persistence through action."

[layer.5_network]
symbol = "customer|supplier|vendor|lender|market"
transform = "trade|supply|price|finance"
structure = "graph"
ascii_math = "G=(V,E); firm -> supplier -> customer"
rust = "G.add_edge(firm, supplier)"
meaning = "Networks decide what actions are reachable."

[layer.6_currency]
symbol = "cash|credit|price|optionality"
transform = "pay|borrow|price|allocate"
structure = "survival_constraint"
ascii_math = "cash_t + inflow - outflow -> cash_t+1"
rust = "runway = cash / burn"
meaning = "Currency is persistence-time."

[layer.7_policy]
symbol = "risk_adjusted_action"
transform = "choose|quote|finance|allocate"
structure = "decision_surface"
ascii_math = "policy = argmax_a EV(a)-risk(a)"
rust = "quote = optimize(job, simulations)"
meaning = "Policy is consequence selection."

[moat]
physical = "materials|DFT|electronics|manufacturing_physics"
information = "embeddings|real_time_control|quote_history|supplier_data|customer_data"
currency = "pricing_intelligence|cash_flow_risk|capital_allocation"
claim = "Moat = better compression of physics + information + money into policy."