[fn]
semantic = "representation of symbols, transforms, and structures"

[fn.symbols]
symbol = { id = "Symbol", semantic = "object | state | value" }
transform = { id = "Transform", semantic = "change | relation | process" }
structure = { id = "Structure", semantic = "composition | organization | system" }

[fn.layers]
toml = { id = "TomlLayer", semantic = "structured storage" }
ascii_math = { id = "AsciiMathLayer", semantic = "formal compression" }
rust = { id = "RustLayer", semantic = "execution intuition" }
diagram = { id = "DiagramLayer", semantic = "visual composition" }

[fn.structure.layer_graph]
kind = "directed_graph"
description = "representation layer dependency graph"
uses = "fn.layers"

adjacency = [
  { from = "toml", to = ["ascii_math", "rust", "diagram"] },
  { from = "ascii_math", to = ["diagram"] },
  { from = "rust", to = ["diagram"] },
]

[fn.representation_symbols]
obj = { id = "Object", semantic = "stable thing" }
st = { id = "State", semantic = "system condition" }
val = { id = "Value", semantic = "contained data" }
op = { id = "Operation", semantic = "state-changing transform" }
fnc = { id = "Function", semantic = "typed input-output transform" }
gph = { id = "Graph", semantic = "nodes and directed edges" }

[fn.representation_transforms]
name = { id = "name", semantic = "assign stable symbol" }
type = { id = "type", semantic = "attach meaning boundary" }
compose = { id = "compose", semantic = "combine transforms" }
execute = { id = "execute", semantic = "run transform over state" }
visualize = { id = "visualize", semantic = "render structure as graph" }

[fn.structure.representation_graph]
kind = "directed_graph"
description = "symbol-transform-structure composition graph"
uses_symbols = "fn.representation_symbols"
uses_transforms = "fn.representation_transforms"

adjacency = [
  { from = "obj", to = ["st", "val"], transform = "type" },
  { from = "st", to = ["op"], transform = "name" },
  { from = "op", to = ["st"], transform = "execute" },
  { from = "fnc", to = ["fnc"], transform = "compose" },
  { from = "gph", to = ["obj", "op"], transform = "visualize" },
]

[fn.rust_patterns]
symbol = "let x: T"
function = "fn f(a: A) -> B"
composition = "let c = g(f(a));"
state_step = "state = op(state);"
graph = "HashMap<Node, Vec<Node>>"
match = "match x { pattern => result, ... }"
iteration = "(1..=5).for_each(|i| println!(i));"

[fn.rules]
policy = { truth = "toml", prefer = ["symbols", "adjacency", "rust_names"], avoid = ["inline_arrows", "untyped_nodes", "repeated_prose"] }
[fn.rules.syntax]
policy = { sections = "snake_case", symbols = "short_lowercase", ids = "RustLikePascalCase", transforms = "snake_case", edges = "adjacency_only" }


[fn.structure.syntax_policy_graph]
kind = "directed_graph"
description = "valid syntax policy graph"
uses = "fn.rules.syntax"

adjacency = [
  { from = "section_names", to = ["symbol_keys"] },
  { from = "symbol_keys", to = ["ids", "transforms"] },
  { from = "ids", to = ["edges"] },
  { from = "transforms", to = ["edges"] },
]

[fn.ascii_math]
semantic = "compact symbolic notation for algebra, calculus, and formal relationships"
role = "human-readable math layer inside toml"
source_of_truth = "toml symbols + adjacency + typed expressions"
not_source_of_truth = false

[fn.ascii_math.domains]
linear_algebra = { id = "LinearAlgebra", semantic = "vectors, matrices, tensors, operators" }
calculus = { id = "Calculus", semantic = "limits, derivatives, integrals, gradients" }
optimization = { id = "Optimization", semantic = "objective functions and constraints" }
dynamics = { id = "Dynamics", semantic = "state evolution over time" }
probability = { id = "Probability", semantic = "random variables, distributions, expectation" }

[fn.ascii_math.syntax]
linear_algebra = "vector:x in R^n | matrix:A in R^(m x n) | tensor:T in R^(i x j x k) | affine:y = A x + b | compose:h = g o f"
calculus = "derivative:df/dx | partial:partial f / partial x_i | gradient:grad f(x) | integral:int_a^b f(x) dx | ode:dx/dt = f(x,t)"
optimization = "loss:L(theta) = sum_i (y_i - f_theta(x_i))^2 | argmin:theta* = argmin_theta L(theta) | constraint:g(theta) <= 0"
probability = "expectation:E[X] | variance:Var(X) | conditional:P(Y | X)"