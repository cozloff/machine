apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: precreate-alloy-log
  namespace: observability
spec:
  selector:
    matchLabels:
      app: precreate-alloy-log
  template:
    metadata:
      labels:
        app: precreate-alloy-log
    spec:
      hostPID: true
      automountServiceAccountToken: false
      containers:
        - name: touch-log
          image: busybox
          command:
            [
              "sh",
              "-c",
              "mkdir -p /var/log && touch /var/log/alloy-processed.log && sleep 10",
            ]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-varlog
              mountPath: /var/log
      volumes:
        - name: host-varlog
          hostPath:
            path: /var/log
            type: Directory
      tolerations:
        - operator: "Exists"
