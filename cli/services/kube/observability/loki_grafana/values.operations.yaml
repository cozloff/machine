loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  persistence: 
    enabled: true
    storageClassName: managed
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  extraEnvFrom:
    - secretRef:
        name: loki-azure-secret # Secret used to connect loki to Azure Blob Storage
  storage:
    type: azure
    bucketNames:
      chunks: loki-logs
      ruler: loki-ruler
      admin: loki-admin

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# Disable all caches
resultsCache:
  enabled: false

chunksCache:
  enabled: false

memcached:
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# Disable canary
canary:
  enabled: false

grafana:
  envFrom:
    - secretRef:
        name: grafana-loki-org
  enabled: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: managed
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  service:
    type: ClusterIP
  sidecar:
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
      secureJsonData:
        httpHeaderValue1: $__env{LOKI_SCOPE_ORG_ID}

